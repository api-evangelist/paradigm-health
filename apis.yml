name: Paradigm Health
description: >-
  Paradigm Health is an AI-native clinical trial platform connecting biopharma
  sponsors with a research-ready provider network spanning roughly 2,100 care
  locations across the United States. Founded in 2021 and headquartered in
  Columbus, Ohio, the company operates infrastructure implemented at healthcare
  provider organizations to make clinical research part of routine care. Its
  Study Conduct platform captures data directly from electronic health records
  and other structured and unstructured sources, algorithmically evaluates
  FDA-defined data points in real time, and transmits the critical safety and
  efficacy signals needed for regulatory determinations to trial sponsors and
  the FDA. Paradigm serves both trial sponsors (protocol optimization,
  feasibility and site selection, patient identification and enrollment, data
  collection and delivery, post-approval evidence) and research sites. The
  company acquired Flatiron Health's Clinical Research business, announced a
  research collaboration with the U.S. FDA, and is backed by ARCH Venture
  Partners, General Catalyst, and GV. Paradigm currently exposes no public API,
  developer portal, or SDK; this profile captures its identity, legal, and
  published security/compliance surface.
